[package]
name = "shower"
version = "0.1.0"
edition = "2021"
authors = ["Guo Zheyong <guozheyong@erayt.com>"]
exclude = ["tests", "test_data", "benches", "examples", ".vscode"]
homepage = ""
repository = ""
license = "Apache-2.0"
readme = "README.md"
description = ""
categories = [""]
documentation = ""
keywords = [""]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bench]]
name = "benchmarks1"
harness = false

[[bench]]
name = "benchmarks2"
harness = false

[dependencies]
config = "0.13.3"
log = "0.4.17"
log4rs = { version = "1.2.0", features = [] }
hashbrown = "0.14.1"
core_affinity = "0.8.1"
chrono = "0.4.31"
sql-parse = "0.16.0"
strum = "0.25.0"
strum_macros = "0.25"
tikv-jemalloc-sys = "0.5.4+5.3.0-patched"
tikv-jemallocator = "0.5.4"
tikv-jemalloc-ctl = "0.5.4"
inkwell = { version = "0.2.0", features = ["llvm14-0"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
