[package]
name = "shower"
version = "0.1.0"
edition = "2021"
authors = ["Guo Zheyong <guozheyong@erayt.com>"]
exclude = ["tests", "test_data", "benches", "examples", ".vscode"]
homepage = ""
repository = ""
license = "Apache-2.0"
readme = "README.md"
description = ""
categories = [""]
documentation = ""
keywords = [""]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [[bench]]
# name = "benchmarks"
# harness = false

[dependencies]
config = "0.13.3"
log = "0.4.17"
log4rs = { version = "1.2.0", features = [] }
state = { version = "0.5.3", features = ["tls"] }
hashbrown = "0.14.1"
core_affinity = "0.8.1"
chrono = "0.4.31"
mlua = { version = "0.8.10", features = ["luajit52", "vendored", "async"] }
sql-parse = "0.15.0"
strum = "0.25.0"
strum_macros = "0.25"

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }
