[package]
name = "shower"
version = "0.1.0"
edition = "2021"
authors = ["Guo Zheyong <guozheyong@erayt.com>"]
exclude = ["tests", "test_data", "benches", "examples", ".vscode"]
homepage = ""
repository = ""
license = "Apache-2.0"
readme = "README.md"
description = ""
categories = [""]
documentation = ""
keywords = [""]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [[bench]]
# name = "benchmarks"
# harness = false

[dependencies]
config = "0.13.3"
log = "0.4.17"
log4rs = { version = "1.2.0", features = [] }
state = { version = "0.5.3", features = ["tls"] }
hashbrown = "0.13.2"
#v8 = "0.73.0"
rquickjs = "0.3.1"
sql-parse = "0.15.0"
multiqueue = "0.3.2"
core_affinity = "0.8.1"

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }
