[package]
name = "bpe"
version = "0.3.0-dev" # managed by updgitver
edition = "2021"
authors = ["Guo Zheyong <guozheyong@erayt.com>"]
exclude = ["tests", "test_data", "benches", "examples", ".vscode"]
homepage = ""
repository = ""
license = "Apache-2.0"
readme = "README.md"
description = ""
categories = [""]
documentation = ""
keywords = [""]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bench]]
name = "benchmarks1"
harness = false

[[bench]]
name = "benchmarks2"
harness = false

[dependencies]
config = "0.15.11"
log = "0.4.17"
log4rs = "1.3.0"
hashbrown = "0.15.2"
core_affinity = "0.8.1"
chrono = "0.4.31"
sql-parse = "0.24.0"
strum = "0.27.1"
strum_macros = "0.27.1"
inkwell = { version = "0.7.1", features = ["llvm19-1"] }
globalvar = "0.2.0"

[dev-dependencies]
criterion = { version = "0.6.0", features = ["html_reports"] }
