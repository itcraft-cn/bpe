refresh_rate: 30 seconds
appenders:
  stdout:
    kind: console
    encoder:
      pattern: "[{d}][{h({l})}][{I}|{h({T})}][{t}\\(L{L}\\)] {m}{n}"
  file:
    kind: rolling_file
    path: "/tmp/shower.log"
    encoder:
      pattern: "[{d}][{l}][{I}|{T}][{t}\\(L{L}\\)] {m}{n}"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 200mb
      roller:
        kind: fixed_window
        base: 1
        count: 20
        pattern: "/tmp/shower.{}.log"
root:
  level: info
  appenders:
    - stdout
    - file
